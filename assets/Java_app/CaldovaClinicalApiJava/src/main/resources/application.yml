server:
  port: ${SERVER_PORT:8000}

spring:
  application:
    name: caldova-clinical-api
  jackson:
    default-property-inclusion: non_null

caldova:
  data-mode: ${DATA_MODE:database}
  allowed-origins: ${ALLOWED_ORIGINS:http://127.0.0.1:8501,http://localhost:8501}
  datasource:
    host: ${DATABASE_HOST:}
    port: ${DATABASE_PORT:5432}
    database: ${DATABASE_NAME:}
    username: ${DATABASE_USER:}

springdoc:
  swagger-ui:
    path: /docs