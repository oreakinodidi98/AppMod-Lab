apiVersion: apps/v1
kind: Deployment
metadata:
  name: __API_NAME__
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: __API_NAME__
  template:
    metadata:
      labels:
        app.kubernetes.io/name: __API_NAME__
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: __SERVICE_ACCOUNT__
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: __API_IMAGE__
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: __CONFIG_NAME__
          startupProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: __API_NAME__
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: __API_NAME__
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: __WEB_NAME__
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: __WEB_NAME__
  template:
    metadata:
      labels:
        app.kubernetes.io/name: __WEB_NAME__
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: __WEB_IMAGE__
          ports:
            - name: http
              containerPort: 8501
          envFrom:
            - configMapRef:
                name: __CONFIG_NAME__
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: __WEB_NAME__
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: __WEB_NAME__
  ports:
    - name: http
      port: 80
      targetPort: http
