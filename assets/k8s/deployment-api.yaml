apiVersion: apps/v1
kind: Deployment
metadata:
  name: caldovaclinicalapi
  namespace: caldova
  labels:
    app.kubernetes.io/name: caldovaclinicalapi
    app.kubernetes.io/part-of: caldova
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: caldovaclinicalapi
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: caldovaclinicalapi
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: caldovaclinicalapi
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: caldovaclinicalapi
          image: oreacrregistry.azurecr.io/caldova-clinical-api-java:1.0.2-demo
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: caldovaclinicalapi-config
          startupProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL