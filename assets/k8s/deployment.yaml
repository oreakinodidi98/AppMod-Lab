apiVersion: apps/v1
kind: Deployment
metadata:
  name: caldovaclinicalweb
  namespace: caldova
  labels:
    app.kubernetes.io/name: caldovaclinicalweb
    app.kubernetes.io/managed-by: containerization-assist
  annotations:
    com.azure.containerizationassist/version: "1.5.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: caldovaclinicalweb
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: caldovaclinicalweb
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: caldovaclinicalweb
          image: oreacrregistry.azurecr.io/caldova-clinical-web-java:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8501
              protocol: TCP
          envFrom:
            - configMapRef:
                name: caldovaclinicalweb-config
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL