# This workflow builds the web image in ACR and deploys it to AKS.
# Azure authentication uses GitHub OIDC with these repository secrets:
# - AZURE_CLIENT_ID
# - AZURE_TENANT_ID
# - AZURE_SUBSCRIPTION_ID

name: deploy-CaldovaClinicalWeb-to-aks

on:
    push:
        branches: [main]
        paths:
            - 'Java_app/CaldovaClinicalWebJava/**'
    pull_request:
        branches: [main]
        paths:
            - 'Java_app/CaldovaClinicalWebJava/**'
    schedule:
        - cron: '00 14 * * 1'
    workflow_dispatch:

env:
    ACR_RESOURCE_GROUP: prometheuslab1779404459
    AZURE_CONTAINER_REGISTRY: oreacrregistry
    CONTAINER_NAME: caldova-clinical-web-java
    CLUSTER_NAME: myakscluster1779404459
    CLUSTER_RESOURCE_GROUP: prometheuslab1779404459
    DEPLOYMENT_MANIFEST_PATH: |
        k8s/configmap.yaml
        k8s/deployment.yaml
        k8s/service.yaml
    DOCKER_FILE: Java_app/CaldovaClinicalWebJava/Dockerfile
    BUILD_CONTEXT_PATH: Java_app/CaldovaClinicalWebJava
    NAMESPACE: caldova

jobs:
    buildImage:
        permissions:
            contents: read
            id-token: write
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Azure login
              uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: Build and push image to ACR
              run: |
                  az acr build \
                    --image ${{ env.CONTAINER_NAME }}:${{ github.sha }} \
                    --registry ${{ env.AZURE_CONTAINER_REGISTRY }} \
                    --resource-group ${{ env.ACR_RESOURCE_GROUP }} \
                    --file ${{ env.DOCKER_FILE }} \
                    ${{ env.BUILD_CONTEXT_PATH }}

    deploy:
        permissions:
            actions: read
            contents: read
            id-token: write
        runs-on: ubuntu-latest
        needs: [buildImage]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Azure login
              uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: Get AKS credentials
              run: |
                  az aks get-credentials \
                    --resource-group ${{ env.CLUSTER_RESOURCE_GROUP }} \
                    --name ${{ env.CLUSTER_NAME }} \
                    --file "${{ runner.temp }}/kubeconfig" \
                    --overwrite-existing

                  echo "KUBECONFIG=${{ runner.temp }}/kubeconfig" >> $GITHUB_ENV

            - name: Deploy application
              uses: Azure/k8s-deploy@bf1ec05e1d736ac4ac70bae889d3ec48c79e2213 # v7.0.1
              with:
                  action: deploy
                  manifests: ${{ env.DEPLOYMENT_MANIFEST_PATH }}
                  images: |
                      ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_NAME }}:${{ github.sha }}
                  namespace: ${{ env.NAMESPACE }}

            - name: Annotate deployment
              run: |
                  kubectl annotate deployment caldovaclinicalweb \
                    --namespace ${{ env.NAMESPACE }} \
                    aks-project/pipeline-repo="${{ github.repository }}" \
                    aks-project/pipeline-workflow="${{ github.workflow }}" \
                    aks-project/deployed-by="vscode" \
                    aks-project/pipeline-run-url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                    --overwrite
